name: Crypto Flows Report

on:
  schedule:
    # Every 15 minutes, offset from round minutes (GitHub often delays or drops runs at :00, :15, ...).
    # The daily summary goes out on the first run after 08:00 Vietnam time.
    - cron: "4-59/15 * * * *"
  workflow_dispatch:
    inputs:
      force_daily:
        description: Send the daily summary push now (for testing)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: flows-report
  cancel-in-progress: false

env:
  TITLE: Crypto Flows Report

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Load previous report
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body > PREV_FLOWS.md
          fi

      - name: Build flows report
        env:
          PREV_REPORT_PATH: PREV_FLOWS.md
          REPORT_PATH: FLOWS.md
          ALERT_PATH: FLOWS_ALERT.txt
          DAILY_PATH: FLOWS_DAILY.txt
          FORCE_DAILY: ${{ inputs.force_daily }}
        run: python3 flows.py

      - name: Update flows issue
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            url=$(gh issue create --title "$TITLE" --body-file FLOWS.md)
          else
            gh issue edit "$NUMBER" --body-file FLOWS.md
            url="${{ github.server_url }}/${{ github.repository }}/issues/$NUMBER"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Send push notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_URL: ${{ steps.update.outputs.url }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::The NTFY_TOPIC secret is not set, so no push was sent."
            exit 0
          fi
          push() { # title priority tags file
            curl -sS --fail-with-body -H "Title: $1" -H "Priority: $2" -H "Tags: $3" \
              -H "Click: $REPORT_URL" --data-binary @"$4" "https://ntfy.sh/$NTFY_TOPIC"
            echo
          }
          if [ -s FLOWS_ALERT.txt ]; then push "Crypto flow alert" high rotating_light FLOWS_ALERT.txt; fi
          if [ -s FLOWS_DAILY.txt ]; then push "Daily crypto flows" default moneybag FLOWS_DAILY.txt; fi

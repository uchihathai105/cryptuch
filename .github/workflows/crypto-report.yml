name: Crypto Report

on:
  # Started by cron-job.org through the workflow_dispatch API (GitHub's own schedule was
  # throttled to about one run every 4-5 hours). See README "Scheduling".
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: crypto-report
  cancel-in-progress: false

env:
  TITLE: Crypto Market Report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Load previous report
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body > PREV_REPORT.md
          fi

      - name: Build report
        env:
          PREV_REPORT_PATH: PREV_REPORT.md
          NOTIFY_PATH: NOTIFY.txt
          NOTIFY_ALWAYS: "true" # push on every run; signal changes are marked "OLD → NEW"
        run: python3 report.py

      - name: Show report in run summary
        run: cat REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$TITLE" --body-file REPORT.md
          else
            gh issue edit "$NUMBER" --body-file REPORT.md
          fi

      - name: Send push notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.issue.outputs.number }}
        run: |
          if [ ! -s NOTIFY.txt ]; then
            echo "Nothing to send (no coin data this run)."
            exit 0
          fi
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::The NTFY_TOPIC secret is not set, so no push was sent."
            exit 0
          fi
          # A changed signal gets a louder, distinct push; routine updates use normal priority.
          if grep -q "→" NOTIFY.txt; then
            title="Crypto signal CHANGED"; priority=high; tags=rotating_light
          else
            title="Crypto prices"; priority=default; tags=chart_with_upwards_trend
          fi
          curl -sS --fail-with-body \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: $tags" \
            -H "Click: $REPORT_URL" \
            --data-binary @NOTIFY.txt \
            "https://ntfy.sh/$NTFY_TOPIC"
